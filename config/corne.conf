# BLE + split básico
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y

# Power estable
CONFIG_BT_CTLR_TX_PWR_0=y

# Sleep básico estable
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Debounce normal
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# IMPORTANTE: evita USB experimental raro
CONFIG_ZMK_USB=y
# NO USB_DEVICE_BOS tweaks