# --- BLE base ---
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

# --- USB ---
CONFIG_ZMK_USB=y

# --- Persistencia (CLAVE para macOS) ---
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# --- Radio estable ---
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n

# --- Sleep (ajustado para evitar “dead reconnect”) ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=180000

# --- Opcional pero recomendable ---
CONFIG_BT_MAX_CONN=1

# --- Debounce ---
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10