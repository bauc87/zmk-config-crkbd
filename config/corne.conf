# ========================
# 🔵 Bluetooth (estable)
# ========================

CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_0=y


# ========================
# 🔗 Split
# ========================

CONFIG_ZMK_SPLIT_BLE=y


# ========================
# 😴 Power management
# ========================

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000   # 5 minutos


# ========================
# ⏱️ Debounce
# ========================

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10


# ========================
# 🔌 USB + BLE
# ========================

CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_BOS=n


# ========================
# 🧪 Studio (opcional)
# ========================

# Si no lo usas diario, mejor desactivarlo:
# CONFIG_ZMK_STUDIO is not set